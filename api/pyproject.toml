[project]
name = "doctool"
version = "0.1.0"
description = "Local, open-source PDF toolbox with a library and version history"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi", "uvicorn[standard]", "pydantic", "sqlalchemy", "python-multipart",
  "pikepdf", "pypdfium2", "reportlab", "img2pdf", "pillow",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "mypy"]

[tool.setuptools.packages.find]
include = ["doctool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
